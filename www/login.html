<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronosID - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } } }</script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-900/80 border border-slate-800 p-8 rounded-3xl shadow-2xl max-w-md w-full backdrop-blur-xl">
        <div class="flex flex-col items-center mb-6">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center shadow-lg mb-3">
                <i class="fa-solid fa-fingerprint text-white text-xl"></i>
            </div>
            <h1 class="text-xl font-bold text-white">Chronos<span class="text-indigo-400">ID</span></h1>
            <p class="text-xs text-slate-400">Identificação Biométrica</p>
        </div>

        <!-- Mensagem de Feedback de Estado -->
        <div id="status-feedback" class="hidden mb-4 p-3 rounded-xl text-xs font-medium text-center border"></div>

        <form onsubmit="realizarLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-400 mb-1 font-medium">Nome do Funcionário</label>
                <input type="text" id="login-nome" required placeholder="Ex: João Silva" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-slate-400 mb-1 font-medium">Senha</label>
                <input type="password" id="login-senha" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" id="btn-submit" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white py-3.5 rounded-xl font-semibold text-sm shadow-lg transition active:scale-[0.98]">
                Entrar no Sistema
            </button>
        </form>
    </div>

    <script>
        const API_URL = 'https://espelho-p5wk.onrender.com';

        function mostrarFeedback(mensagem, tipo) {
            const box = document.getElementById('status-feedback');
            box.innerText = mensagem;
            box.classList.remove('hidden', 'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20', 'bg-rose-500/10', 'text-rose-400', 'border-rose-500/20', 'bg-indigo-500/10', 'text-indigo-400', 'border-indigo-500/20');
            
            if (tipo === 'sucesso') {
                box.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20');
            } else if (tipo === 'erro') {
                box.classList.add('bg-rose-500/10', 'text-rose-400', 'border-rose-500/20');
            } else {
                box.classList.add('bg-indigo-500/10', 'text-indigo-400', 'border-indigo-500/20');
            }
        }

        async function realizarLogin(e) {
            e.preventDefault();
            const nome = document.getElementById('login-nome').value.trim();
            const senha = document.getElementById('login-senha').value.trim();
            const botao = document.getElementById('btn-submit');

            botao.disabled = true;
            botao.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> A verificar...';
            mostrarFeedback('A contactar o servidor...', 'info');

            try {
                const res = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, senha })
                });

                const user = await res.json();
                
                if (res.ok) {
                    mostrarFeedback('✓ Acesso válido! A entrar...', 'sucesso');
                    localStorage.setItem('usuario_logado', JSON.stringify(user));
                    
                    setTimeout(() => {
                        if (user.cargo === 'admin') {
                            window.location.replace('admin.html');
                        } else {
                            window.location.replace('index.html');
                        }
                    }, 800);
                } else {
                    // Tratamento personalizado para senha incorreta ou outros erros
                    let msgErro = user.error || 'Erro ao realizar login.';
                    if (res.status === 401 || msgErro.toLowerCase().includes('senha')) {
                        msgErro = '⚠️ Senha inválida!';
                    }
                    mostrarFeedback(msgErro, 'erro');
                    botao.disabled = false;
                    botao.innerHTML = 'Entrar no Sistema';
                }
            } catch (err) {
                console.error("Erro de rede:", err);
                mostrarFeedback('⚠️ Erro de ligação. O servidor no Render pode estar a iniciar, tente novamente.', 'erro');
                botao.disabled = false;
                botao.innerHTML = 'Entrar no Sistema';
            }
        }
    </script>
</body>
</html>
