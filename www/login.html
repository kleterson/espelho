<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronosID - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } } }</script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-900/80 border border-slate-800 p-8 rounded-3xl shadow-2xl max-w-md w-full backdrop-blur-xl">
        <div class="flex flex-col items-center mb-6">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center shadow-lg mb-3">
                <i class="fa-solid fa-fingerprint text-white text-xl"></i>
            </div>
            <h1 class="text-xl font-bold text-white">Chronos<span class="text-indigo-400">ID</span></h1>
            <p class="text-xs text-slate-400">Identificação Biométrica</p>
        </div>

        <form onsubmit="realizarLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-400 mb-1 font-medium">Nome do Funcionário</label>
                <input type="text" id="login-nome" required placeholder="Ex: João Silva" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-slate-400 mb-1 font-medium">Senha</label>
                <input type="password" id="login-senha" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white py-3.5 rounded-xl font-semibold text-sm shadow-lg transition active:scale-[0.98]">
                Entrar no Sistema
            </button>
        </form>
    </div>

    <script>
        const API_URL = 'https://espelho-p5wk.onrender.com';

        async function realizarLogin(e) {
            e.preventDefault();
            const nome = document.getElementById('login-nome').value.trim();
            const senha = document.getElementById('login-senha').value.trim();

            try {
                const res = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, senha })
                });

                const user = await res.json();
                if (res.ok) {
                    localStorage.setItem('usuario_logado', JSON.stringify(user));
                    
                    if (user.cargo === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    alert(user.error || 'Erro ao realizar login.');
                }
            } catch (err) {
                console.error("Erro de rede:", err);
                alert('Não foi possível ligar ao servidor. Verifique a ligação à internet.');
            }
        }
    </script>
</body>
</html>
