<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronosID - Ponto Facial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } } }</script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

    <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-xl sticky top-0 z-40 px-4 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-fingerprint text-white text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-white" id="nome-usuario-header">Carregando...</h1>
                <p class="text-xs text-slate-400">Ponto Facial na Nuvem</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <div id="relogio" class="text-sm font-mono font-semibold bg-slate-800/80 border border-slate-700/60 px-3 py-1.5 rounded-xl text-indigo-300">--:--:--</div>
            <button onclick="sair()" class="bg-slate-800 hover:bg-slate-700 text-rose-400 px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-700"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
        
        <!-- Câmera -->
        <section class="bg-slate-900/60 border border-slate-800/80 p-5 rounded-3xl shadow-2xl flex flex-col items-center">
            <div class="flex items-center justify-between w-full mb-3">
                <h2 class="text-sm font-semibold text-slate-200"><i class="fa-solid fa-camera mr-2 text-indigo-400"></i>Reconhecimento Facial</h2>
                <span id="instrucao-biometria" class="text-[11px] px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-medium">Pronto para iniciar</span>
            </div>

            <div class="relative w-full h-72 bg-slate-950 rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center mb-4">
                <video id="video" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
                <canvas id="canvas" class="hidden"></canvas>
                
                <div id="face-guide" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none hidden">
                    <div class="w-44 h-52 border-4 border-indigo-500/80 rounded-full shadow-[0_0_30px_rgba(99,102,241,0.5)] animate-pulse flex items-center justify-center">
                        <div class="text-indigo-300 text-[10px] font-semibold uppercase bg-slate-950/70 px-2 py-1 rounded-full border border-indigo-500/40">Centralize o Rosto</div>
                    </div>
                </div>

                <div id="msg-sucesso-ponto" class="absolute inset-0 bg-emerald-950/95 backdrop-blur-md flex flex-col items-center justify-center text-center p-6 hidden z-20">
                    <div class="w-14 h-14 bg-emerald-500 text-white rounded-full flex items-center justify-center text-xl mb-2"><i class="fa-solid fa-check"></i></div>
                    <h3 class="text-lg font-bold text-white">Ponto Batido com Sucesso!</h3>
                    <p id="texto-tipo-ponto" class="text-xs text-emerald-300 font-medium mt-1"></p>
                </div>

                <div id="camera-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 bg-slate-950">
                    <i class="fa-solid fa-face-smile text-3xl mb-2 text-indigo-400"></i>
                    <span class="text-xs text-slate-400">Clique abaixo para ativar o reconhecimento</span>
                </div>
            </div>

            <button onclick="baterPontoAutomatico()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold py-4 rounded-xl shadow-lg text-xs flex items-center justify-center space-x-2 transition active:scale-[0.98]">
                <i class="fa-solid fa-fingerprint text-base"></i>
                <span>Bater Ponto Facial Automático</span>
            </button>
        </section>

        <!-- Histórico -->
        <section class="bg-slate-900/60 border border-slate-800/80 p-5 rounded-3xl shadow-2xl flex flex-col">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                <h2 class="text-sm font-bold text-white"><i class="fa-solid fa-calendar-days mr-2 text-indigo-400"></i>Espelho de Ponto</h2>
                <input type="month" id="seletor-mes" onchange="carregarCalendario()" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs font-medium px-2.5 py-1.5 rounded-xl">
            </div>

            <div class="overflow-x-auto rounded-2xl border border-slate-800/60 bg-slate-950/40">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-[10px] font-semibold text-slate-400 uppercase bg-slate-900/40">
                            <th class="py-2.5 px-2">Dia</th>
                            <th class="py-2.5 px-2">Ent.</th>
                            <th class="py-2.5 px-2">Pau.</th>
                            <th class="py-2.5 px-2">Ret.</th>
                            <th class="py-2.5 px-2">Saí.</th>
                            <th class="py-2.5 px-2 text-center">Foto</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-ponto" class="text-xs divide-y divide-slate-800/50"></tbody>
                </table>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-800/80 flex justify-between items-center text-xs">
                <button onclick="abrirModalEdicao()" class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1.5 rounded-xl font-medium"><i class="fa-solid fa-pen-to-square mr-1"></i> Solicitar Correção</button>
                <button onclick="limparHistoricoMes()" class="text-rose-400 bg-rose-500/10 px-3 py-1.5 rounded-xl border border-rose-500/20"><i class="fa-solid fa-trash-can mr-1"></i> Limpar Mês</button>
            </div>
        </section>
    </main>

    <!-- Modais (Edição e Foto) -->
    <div id="modal-edicao" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-3xl max-w-md w-full">
            <h3 class="font-bold text-slate-200 mb-3 text-sm">Solicitar Correção</h3>
            <div class="space-y-3 text-xs">
                <div><label class="block text-slate-400 mb-1">Data</label><input type="date" id="edit-data" class="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-slate-200"></div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block text-slate-400 mb-1">Tipo</label><select id="edit-tipo" class="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-slate-200"><option value="entrada">Entrada</option><option value="pausa">Pausa</option><option value="retorno">Retorno</option><option value="saida">Saída</option></select></div>
                    <div><label class="block text-slate-400 mb-1">Hora</label><input type="time" id="edit-horario" class="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-slate-200"></div>
                </div>
                <div><label class="block text-slate-400 mb-1">Motivo</label><textarea id="edit-motivo" rows="2" class="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-slate-200"></textarea></div>
            </div>
            <div class="flex space-x-2 mt-4">
                <button onclick="enviarSolicitacao()" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-xs font-semibold">Enviar Pedido</button>
                <button onclick="fecharModalEdicao()" class="bg-slate-800 text-slate-300 py-2 px-3 rounded-xl text-xs font-semibold">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modal-foto" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-3xl max-w-sm w-full text-center">
            <h3 class="font-semibold text-slate-200 mb-3 text-xs">Selfie Biométrica</h3>
            <img id="img-modal" src="" class="w-full h-56 object-cover rounded-xl mb-3 transform -scale-x-100">
            <button onclick="fecharModalFoto()" class="w-full bg-slate-800 text-slate-200 py-2 rounded-xl text-xs font-semibold">Fechar</button>
        </div>
    </div>

    <script>
        const usuario = JSON.parse(sessionStorage.getItem('usuario_logado'));
        if (!usuario) { window.location.href = 'login.html'; }
        document.getElementById('nome-usuario-header').innerText = usuario.nome;

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const cameraPlaceholder = document.getElementById('camera-placeholder');
        const faceGuide = document.getElementById('face-guide');
        const instrucaoBiometria = document.getElementById('instrucao-biometria');
        const msgSucessoPonto = document.getElementById('msg-sucesso-ponto');
        let streamAtivo = null;

        const agoraGlobal = new Date();
        document.getElementById('seletor-mes').value = `${agoraGlobal.getFullYear()}-${String(agoraGlobal.getMonth() + 1).padStart(2, '0')}`;
        setInterval(() => { document.getElementById('relogio').innerText = new Date().toLocaleTimeString('pt-PT'); }, 1000);

        async function baterPontoAutomatico() {
            try {
                if (!streamAtivo) {
                    instrucaoBiometria.innerText = "A ligar a câmara...";
                    streamAtivo = await navigator.mediaDevices.getUserMedia({ video: { width: 400, height: 400 } });
                    video.srcObject = streamAtivo;
                    cameraPlaceholder.classList.add('hidden');
                    faceGuide.classList.remove('hidden');
                    instrucaoBiometria.innerText = "Centralize o rosto...";
                    
                    setTimeout(() => { executarRegistoPonto(); }, 1800);
                } else {
                    executarRegistoPonto();
                }
            } catch (err) {
                alert('Erro ao aceder à câmara.');
            }
        }

        async function executarRegistoPonto() {
            if (!streamAtivo) return;

            canvas.width = video.videoWidth || 400;
            canvas.height = video.videoHeight || 400;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const fotoBase64 = canvas.toDataURL('image/png');

            const agora = new Date();
            const dataKey = `${agora.getFullYear()}-${String(agora.getMonth() + 1).padStart(2, '0')}-${String(agora.getDate()).padStart(2, '0')}`;
            const horaAtual = agora.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });

            const res = await fetch(`/api/pontos/${usuario.id}`);
            const todosPontos = await res.json();
            let reg = todosPontos[dataKey] || { usuario_id: usuario.id, data: dataKey, entrada: '-', pausa: '-', retorno: '-', saida: '-', foto: null };

            let tipoMsg = '';
            if (reg.entrada === '-') { reg.entrada = horaAtual; tipoMsg = `Entrada às ${horaAtual}`; }
            else if (reg.pausa === '-') { reg.pausa = horaAtual; tipoMsg = `Pausa às ${horaAtual}`; }
            else if (reg.retorno === '-') { reg.retorno = horaAtual; tipoMsg = `Retorno às ${horaAtual}`; }
            else { reg.saida = horaAtual; tipoMsg = `Saída às ${horaAtual}`; }

            reg.foto = fotoBase64;
            reg.usuario_id = usuario.id;

            await fetch('/api/pontos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(reg)
            });

            streamAtivo.getTracks().forEach(track => track.stop());
            streamAtivo = null;
            faceGuide.classList.add('hidden');
            cameraPlaceholder.classList.remove('hidden');

            document.getElementById('texto-tipo-ponto').innerText = tipoMsg;
            msgSucessoPonto.classList.remove('hidden');
            setTimeout(() => {
                msgSucessoPonto.classList.add('hidden');
                carregarCalendario();
                instrucaoBiometria.innerText = "Pronto para iniciar";
            }, 2500);
        }

        async function carregarCalendario() {
            const valorMes = document.getElementById('seletor-mes').value;
            const [ano, mesStr] = valorMes.split('-');
            const mesIndex = parseInt(mesStr) - 1;
            const totalDias = new Date(ano, mesIndex + 1, 0).getDate();

            const res = await fetch(`/api/pontos/${usuario.id}`);
            const registros = await res.json();

            let html = '';
            for (let dia = 1; dia <= totalDias; dia++) {
                const dataKey = `${ano}-${mesStr}-${String(dia).padStart(2, '0')}`;
                const reg = registros[dataKey] || { entrada: '-', pausa: '-', retorno: '-', saida: '-', foto: null };
                const dataObj = new Date(ano, mesIndex, dia);
                const diaSemana = dataObj.toLocaleDateString('pt-PT', { weekday: 'short' }).replace('.', '');

                html += `
                    <tr class="hover:bg-slate-800/40">
                        <td class="py-2 px-2 font-medium">${String(dia).padStart(2, '0')} <span class="text-[9px] text-slate-500 uppercase">(${diaSemana})</span></td>
                        <td class="py-2 px-2 text-emerald-400 font-mono">${reg.entrada}</td>
                        <td class="py-2 px-2 text-amber-400 font-mono">${reg.pausa}</td>
                        <td class="py-2 px-2 text-cyan-400 font-mono">${reg.retorno}</td>
                        <td class="py-2 px-2 text-rose-400 font-mono">${reg.saida}</td>
                        <td class="py-2 px-2 text-center">
                            ${reg.foto ? `<button onclick="verFoto('${reg.foto}')" class="text-indigo-400 text-xs"><i class="fa-solid fa-eye"></i></button>` : '-'}
                        </td>
                    </tr>
                `;
            }
            document.getElementById('tabela-ponto').innerHTML = html;
        }

        async function limparHistoricoMes() {
            const valorMes = document.getElementById('seletor-mes').value;
            if (confirm(`Deseja limpar os registos de ${valorMes}?`)) {
                await fetch(`/api/pontos/${usuario.id}/${valorMes}`, { method: 'DELETE' });
                carregarCalendario();
            }
        }

        function abrirModalEdicao() { document.getElementById('modal-edicao').classList.remove('hidden'); document.getElementById('modal-edicao').classList.add('flex'); }
        function fecharModalEdicao() { document.getElementById('modal-edicao').classList.add('hidden'); document.getElementById('modal-edicao').classList.remove('flex'); }

        async function enviarSolicitacao() {
            const data = document.getElementById('edit-data').value;
            const tipo = document.getElementById('edit-tipo').value;
            const horario = document.getElementById('edit-horario').value;
            const motivo = document.getElementById('edit-motivo').value;

            if (!data || !horario || !motivo) { alert('Preencha todos os campos.'); return; }

            await fetch('/api/solicitacoes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario_id: usuario.id, funcionario: usuario.nome, data, tipo, horario, motivo })
            });

            fecharModalEdicao();
            alert('Solicitação enviada ao Admin!');
        }

        function verFoto(url) { document.getElementById('img-modal').src = url; document.getElementById('modal-foto').classList.remove('hidden'); document.getElementById('modal-foto').classList.add('flex'); }
        function fecharModalFoto() { document.getElementById('modal-foto').classList.add('hidden'); document.getElementById('modal-foto').classList.remove('flex'); }
        function sair() { sessionStorage.clear(); window.location.href = 'login.html'; }

        carregarCalendario();
    </script>
</body>
</html>
